name: Redefinir senha de gestor

# Senha não se recupera — o banco guarda hash bcrypt, que é de mão única.
# Quando alguém perde o acesso, este workflow grava uma senha provisória e o
# sistema obriga a troca no primeiro acesso.
#
# A senha vem do secret SENHA_TEMPORARIA (6 dígitos), nunca de um campo do
# formulário: valor digitado em input aparece no log da execução.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-mail da conta que perdeu o acesso"
        required: true
        type: string

env:
  APP_PATH: /opt/app-manutencao

jobs:
  redefinir:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o secret da senha
        run: |
          if [ -z "${{ secrets.SENHA_TEMPORARIA }}" ]; then
            echo "Defina o secret SENHA_TEMPORARIA com 6 dígitos antes de rodar."
            exit 1
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Redefinir
        env:
          EMAIL: ${{ inputs.email }}
          SENHA: ${{ secrets.SENHA_TEMPORARIA }}
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose run --rm --no-deps app \
               node dist/redefinir-senha.js '$EMAIL' '$SENHA'"
