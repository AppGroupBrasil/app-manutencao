name: Unidades de um funcionário

# Vê e marca em quais unidades um funcionário trabalha.
#
# A ficha guarda a unidade de origem; as demais vivem em
# `funcionario_condominios`. Quem foi cadastrado antes de a marcação existir na
# tela não tem linha nenhuma ali e abre o portal preso a uma unidade só — este
# workflow é a saída para esses casos, sem refazer a ficha.
#
# Comece com `buscar`: a saída lista os funcionários com aquele nome, o id de
# cada um e o que já enxergam. Depois rode com `funcionario` mais uma das
# formas de escolher as unidades, sempre com `simular = true` antes de gravar.
#
# Nada é apagado: o script só acrescenta o que falta e reativa o que estava
# desligado. Tirar unidade continua sendo decisão do gestor, na tela.
on:
  workflow_dispatch:
    inputs:
      buscar:
        description: "Parte do nome, só para ver quem é quem (não grava nada)"
        required: false
        type: string
      funcionario:
        description: "Id do funcionário que vai receber as unidades"
        required: false
        type: string
      espelhar:
        description: "Id de um colega: copia as unidades dele"
        required: false
        type: string
      unidades:
        description: "Ou os ids das unidades, separados por vírgula"
        required: false
        type: string
      todas_do_cliente:
        description: "Ou todas as unidades do mesmo cliente"
        required: false
        default: false
        type: boolean
      simular:
        description: "Só mostrar o que faria, sem gravar"
        required: true
        default: true
        type: boolean

env:
  APP_PATH: /opt/app-manutencao

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir os parâmetros
        env:
          BUSCAR: ${{ inputs.buscar }}
          FUNCIONARIO: ${{ inputs.funcionario }}
          ESPELHAR: ${{ inputs.espelhar }}
          UNIDADES: ${{ inputs.unidades }}
          TODAS: ${{ inputs.todas_do_cliente }}
        run: |
          if [ -z "$BUSCAR" ] && [ -z "$FUNCIONARIO" ]; then
            echo "Informe 'buscar' para ver, ou 'funcionario' para marcar."
            exit 1
          fi
          if [ -n "$FUNCIONARIO" ] && [ -z "$ESPELHAR" ] && [ -z "$UNIDADES" ] && [ "$TODAS" != "true" ]; then
            echo "Com 'funcionario', escolha as unidades: 'espelhar', 'unidades' ou 'todas_do_cliente'."
            exit 1
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Rodar
        env:
          BUSCAR: ${{ inputs.buscar }}
          FUNCIONARIO: ${{ inputs.funcionario }}
          ESPELHAR: ${{ inputs.espelhar }}
          UNIDADES: ${{ inputs.unidades }}
          TODAS: ${{ inputs.todas_do_cliente }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          args=""
          [ -n "$BUSCAR" ] && args="$args --buscar=$BUSCAR"
          [ -n "$FUNCIONARIO" ] && args="$args --funcionario=$FUNCIONARIO"
          [ -n "$ESPELHAR" ] && args="$args --espelhar=$ESPELHAR"
          [ -n "$UNIDADES" ] && args="$args --unidades=$UNIDADES"
          [ "$TODAS" = "true" ] && args="$args --todas-do-cliente"
          [ "$SIMULAR" = "true" ] && args="$args --dry-run"

          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose run --rm --no-deps app \
               node dist/unidades-funcionario.js $args"
