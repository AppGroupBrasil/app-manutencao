name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_PATH: /opt/app-manutencao

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest on server
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && git fetch origin main && git reset --hard origin/main"

      # Guarda a imagem que está no ar. É para ela que o deploy volta se a
      # versão nova não ficar saudável.
      - name: Save current image
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker image inspect app-manutencao:latest >/dev/null 2>&1 \
               && docker tag app-manutencao:latest app-manutencao:anterior \
               && echo 'imagem anterior guardada' \
               || echo 'sem imagem anterior (primeiro deploy)'"

      # Build AQUI, não no servidor.
      #
      # Em 13/08/2026 o `docker compose build` rodando na máquina de produção
      # consumiu a memória que faltava e o kernel matou o MySQL compartilhado
      # três vezes, derrubando o app portaria e o app correspondência — que não
      # têm nada a ver com este projeto. São ~20 sistemas em 7,7 GB: construir
      # lá dentro é cobrar dos vizinhos.
      #
      # Aqui a máquina é descartável. Se o build estourar, quem cai é o runner.
      - name: Build image
        run: docker build -t app-manutencao:latest .

      # Manda a imagem pronta. `docker load` é leitura de arquivo: gasta I/O,
      # não a memória que derrubou o banco dos outros sistemas.
      - name: Ship image to server
        run: |
          docker save app-manutencao:latest | gzip -1 | \
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "gunzip | docker load"

      # Pré-voo num container descartável, com o site ainda servindo a versão
      # anterior: confere variáveis de ambiente, confere que o banco está na
      # altura do baseline e aplica as migrações pendentes. Falha aqui não
      # derruba nada.
      - name: Preflight and migrate
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose run --rm --no-deps app node dist/migrar.js"

      - name: Restart with the new image
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose up -d --no-build --remove-orphans"

      # Imagem carregada a cada deploy deixa a anterior pendurada. Sem esta
      # faxina o disco do servidor cresce sozinho — e ele é compartilhado.
      # `prune -f` só apaga imagem sem tag: a `app-manutencao:anterior`, que é
      # o plano de rollback, tem tag e fica.
      - name: Clean dangling images
        if: success()
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker image prune -f | tail -1"

      # Espera o container ficar `healthy` (o healthcheck bate em /api/saude).
      # Se não ficar, volta para a imagem anterior e falha o deploy. As
      # migrações já aplicadas continuam de pé — todas são aditivas, então a
      # versão antiga roda sobre o schema novo sem problema.
      - name: Health check with rollback
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && \
             saudavel=nao; \
             for i in \$(seq 1 24); do \
               estado=\$(docker inspect -f '{{.State.Health.Status}}' app-manutencao 2>/dev/null || echo ausente); \
               echo \"tentativa \$i: \$estado\"; \
               if [ \"\$estado\" = healthy ]; then saudavel=sim; break; fi; \
               if [ \"\$estado\" = unhealthy ]; then break; fi; \
               sleep 5; \
             done; \
             if [ \"\$saudavel\" = sim ]; then echo 'app saudavel'; exit 0; fi; \
             echo '--- logs da versao nova ---'; docker logs --tail 80 app-manutencao; \
             if docker image inspect app-manutencao:anterior >/dev/null 2>&1; then \
               echo '--- voltando para a imagem anterior ---'; \
               docker tag app-manutencao:anterior app-manutencao:latest && \
               docker compose up -d --no-build --force-recreate app && \
               echo 'rollback concluido'; \
             else \
               echo 'sem imagem anterior para voltar'; \
             fi; \
             exit 1"
