name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_PATH: /opt/app-manutencao

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest on server
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && git fetch origin main && git reset --hard origin/main"

      # A imagem é construída antes da troca. Falha de build para o deploy aqui,
      # com a versão antiga ainda no ar.
      - name: Build image
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose build app"

      # Migração num container descartável, com o site ainda servindo a versão
      # anterior. Se o SQL falhar, o passo falha, nada é trocado e o site
      # continua no ar — é isto que tira o risco de reinício em laço.
      - name: Migrate database
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose run --rm --no-deps app node dist/migrar.js"

      - name: Restart with the new image
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ env.APP_PATH }} && docker compose up -d --remove-orphans"

      # O container tem healthcheck em `/api/saude`, que responde 503 quando as
      # migrações falham. Esperar ficar `healthy` evita dar o deploy por bom com
      # um container que subiu torto.
      - name: Health check
        run: |
          ssh -o ServerAliveInterval=30 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "for i in \$(seq 1 24); do \
               estado=\$(docker inspect -f '{{.State.Health.Status}}' app-manutencao 2>/dev/null || echo ausente); \
               echo \"tentativa \$i: \$estado\"; \
               [ \"\$estado\" = healthy ] && exit 0; \
               [ \"\$estado\" = unhealthy ] && break; \
               sleep 5; \
             done; \
             docker logs --tail 80 app-manutencao; exit 1"
