services:
  # ── PostgreSQL dedicado ──
  postgres:
    image: postgres:16-alpine
    container_name: app-manutencao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manutencao
      POSTGRES_USER: manutencao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manutencao"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── App Node (server Express + frontend estático) ──
  app:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    # Nome fixo para o deploy poder guardar a imagem anterior e voltar a ela.
    image: app-manutencao:latest
    container_name: app-manutencao
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://manutencao:${DB_PASSWORD}@app-manutencao-db:5432/manutencao
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required}
      VITE_APP_ID: ${VITE_APP_ID:-app-manutencao-prod}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CRON_SECRET: ${CRON_SECRET:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # /api/saude responde 503 quando as migracoes falham: o container aparece
      # como unhealthy em vez de parecer normal com o schema atrasado.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTPS
      - "traefik.http.routers.app-manutencao-https.rule=Host(`appmanutencao.com.br`) || Host(`www.appmanutencao.com.br`)"
      - "traefik.http.routers.app-manutencao-https.entrypoints=https"
      - "traefik.http.routers.app-manutencao-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-manutencao.loadbalancer.server.port=8080"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.app-manutencao-http.rule=Host(`appmanutencao.com.br`) || Host(`www.appmanutencao.com.br`)"
      - "traefik.http.routers.app-manutencao-http.entrypoints=http"
      - "traefik.http.routers.app-manutencao-http.middlewares=app-manutencao-redirect-https"
      - "traefik.http.middlewares.app-manutencao-redirect-https.redirectscheme.scheme=https"
      # www → raiz
      - "traefik.http.routers.app-manutencao-www.rule=Host(`www.appmanutencao.com.br`)"
      - "traefik.http.routers.app-manutencao-www.entrypoints=https"
      - "traefik.http.routers.app-manutencao-www.tls=true"
      - "traefik.http.routers.app-manutencao-www.middlewares=app-manutencao-redirect-www"
      - "traefik.http.middlewares.app-manutencao-redirect-www.redirectregex.regex=^https://www\\.appmanutencao\\.com\\.br/(.*)"
      - "traefik.http.middlewares.app-manutencao-redirect-www.redirectregex.replacement=https://appmanutencao.com.br/$${1}"
      - "traefik.http.middlewares.app-manutencao-redirect-www.redirectregex.permanent=true"

  # ── Disparo diário dos alertas de vencimento ──
  #
  # O processamento existe desde sempre, mas dependia de alguém chamar o
  # endereço de fora. Sem isto, alerta cadastrado nunca virava e-mail.
  # Repetir no mesmo dia é inofensivo: alerta enviado fica marcado e não sai
  # duas vezes.
  alertas:
    image: alpine:3.19
    container_name: app-manutencao-alertas
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    networks:
      - coolify
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        # Espera o app subir antes da primeira volta.
        sleep 120
        while true; do
          echo "[alertas] $$(date -u +%Y-%m-%dT%H:%M:%SZ) chamando o processamento"
          curl -sS -m 120 -H "x-cron-secret: $$CRON_SECRET" \
            http://app-manutencao:8080/api/cron/processar-alertas || echo "[alertas] falhou"
          echo
          sleep 21600
        done

  # ── Faxina semanal das fotos órfãs ──
  #
  # O upload grava a foto antes de o registro ser salvo: formulário abandonado
  # deixa arquivo que ninguém mais alcança. A varredura só apaga o que nenhuma
  # coluna do banco referencia e o que tem mais de 7 dias — foto recente pode
  # estar num formulário ainda aberto.
  limpeza:
    image: app-manutencao:latest
    container_name: app-manutencao-limpeza
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://manutencao:${DB_PASSWORD}@app-manutencao-db:5432/manutencao
    volumes:
      - uploads:/app/uploads
    networks:
      - coolify
    entrypoint:
      - sh
      - -c
      - |
        sleep 300
        while true; do
          node dist/limpar-imagens.js --apagar || echo "[limpeza] falhou"
          sleep 604800
        done

  # ── Backup diário do banco ──
  backup:
    image: postgres:16-alpine
    container_name: app-manutencao-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - backups:/var/backups/manutencao
      # Somente leitura: o backup copia as fotos, não mexe nelas.
      - uploads:/dados/uploads:ro
    networks:
      - coolify
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /var/backups/manutencao
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h app-manutencao-db -U manutencao manutencao | gzip > /var/backups/manutencao/manutencao_$$TS.sql.gz
          # As fotos ficam em volume, fora do banco: sem esta cópia, restaurar o
          # dump devolveria os registros apontando para imagens que não existem.
          tar -czf /var/backups/manutencao/uploads_$$TS.tar.gz -C /dados uploads
          find /var/backups/manutencao -name 'manutencao_*.sql.gz' -mtime +30 -delete
          find /var/backups/manutencao -name 'uploads_*.tar.gz' -mtime +30 -delete
          sleep 86400
        done

volumes:
  pgdata:
  uploads:
  backups:

networks:
  coolify:
    external: true
